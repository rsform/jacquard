[package]
name = "jacquard-lexgen"
description = "Lexicon fetching and code generation binaries for Jacquard"
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude.workspace = true
license.workspace = true

[[bin]]
name = "jacquard-codegen"
path = "src/bin/codegen.rs"

[[bin]]
name = "lex-fetch"
path = "src/bin/lex_fetch.rs"

[dependencies]
async-trait = "0.1"
clap.workspace = true
glob = "0.3"
jacquard-api = { version = "0.8", git = "https://tangled.org/@nonbinary.computer/jacquard" }
jacquard-common = { version = "0.8", features = [ "reqwest-client" ], git = "https://tangled.org/@nonbinary.computer/jacquard" }
jacquard-identity = { version = "0.8", git = "https://tangled.org/@nonbinary.computer/jacquard" }
jacquard-lexicon = { version = "0.8",  git = "https://tangled.org/@nonbinary.computer/jacquard" }
kdl = "6"
miette = { workspace = true, features = ["fancy"] }
reqwest = { workspace = true, features = ["json", "http2", "system-proxy", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.23"
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = { version = "3.23.0" }

[build-dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true

[package.metadata.binstall]
pkg-url = "https://github.com/rsform/jacquard/releases/download/v{ version }/{ name }_{ target }_v{ version }{ archive-suffix }"
bin-dir = "{ name }_{ target }_v{ version }/bin/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-fmt = "zip"
bin-dir = "{ name }_{ target }_v{ version }/{ bin }{ binary-ext }"
