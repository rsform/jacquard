[package]
name = "jacquard"
description.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude.workspace = true
license.workspace = true

[features]
default = [
    "api_full",
    "dns",
    "loopback",
    "derive",
    "cache",
    "reqwest-client",
    "reqwest-charset",
    "reqwest-json",
    "reqwest-http2",
    "reqwest-system-proxy",
    "reqwest-rustls",
    "reqwest-compression",
]
derive = ["dep:jacquard-derive"]
reqwest-client = [
    "jacquard-common/reqwest-client",
    "jacquard-identity/reqwest-client",
    "jacquard-oauth/reqwest-client",
    "dep:reqwest",
]
reqwest-charset = ["reqwest-client", "jacquard-common/reqwest-charset"]
reqwest-json = ["reqwest-client", "jacquard-common/reqwest-json"]
reqwest-form = ["reqwest-client", "jacquard-common/reqwest-form"]
reqwest-multipart = ["reqwest-client", "jacquard-common/reqwest-multipart"]
reqwest-stream = ["reqwest-client", "jacquard-common/reqwest-stream"]
reqwest-http2 = ["reqwest-client", "jacquard-common/reqwest-http2"]
reqwest-system-proxy = ["reqwest-client", "jacquard-common/reqwest-system-proxy"]
reqwest-hickory-dns = ["reqwest-client", "jacquard-common/reqwest-hickory-dns"]
reqwest-socks = ["reqwest-client", "jacquard-common/reqwest-socks"]
reqwest-default-tls = ["reqwest-client", "jacquard-common/reqwest-default-tls"]
reqwest-rustls = ["reqwest-client", "jacquard-common/reqwest-rustls"]
# Select this instead of `reqwest-rustls` when the application uses ring.
reqwest-rustls-ring = ["reqwest-client", "jacquard-common/reqwest-rustls-ring"]
# Select this instead of a provider feature when the application installs one manually.
reqwest-rustls-no-provider = ["reqwest-client", "jacquard-common/reqwest-rustls-no-provider"]
reqwest-native-tls = ["reqwest-client", "jacquard-common/reqwest-native-tls"]
reqwest-native-tls-vendored = ["reqwest-client", "jacquard-common/reqwest-native-tls-vendored"]
reqwest-native-tls-no-alpn = ["reqwest-client", "jacquard-common/reqwest-native-tls-no-alpn"]
reqwest-native-tls-vendored-no-alpn = ["reqwest-client", "jacquard-common/reqwest-native-tls-vendored-no-alpn"]
reqwest-gzip = ["reqwest-client", "jacquard-common/reqwest-gzip"]
reqwest-brotli = ["reqwest-client", "jacquard-common/reqwest-brotli"]
reqwest-deflate = ["reqwest-client", "jacquard-common/reqwest-deflate"]
reqwest-zstd = ["reqwest-client", "jacquard-common/reqwest-zstd"]
reqwest-compression = [
    "reqwest-gzip",
    "reqwest-brotli",
    "reqwest-deflate",
    "reqwest-zstd",
]
# Minimal API bindings
api = [
    "jacquard-api/minimal",
    "jacquard-api/std",
    "jacquard-common/std",
]
# Bluesky API bindings
api_bluesky = ["api", "jacquard-api/bluesky"]
# Bluesky API bindings, plus a curated selection of community lexicons
api_full = [
    "api_bluesky",
    "jacquard-api/std",
    "jacquard-common/std",
    "jacquard-api/other",
    "jacquard-api/lexicon_community",
    "jacquard-api/network_bsky",
]
# All captured generated lexicon API bindings
api_all = ["api_full", "jacquard-api/ufos"]

# Propagate loopback to oauth (server + browser helper)
loopback = ["jacquard-oauth/loopback", "jacquard-oauth/browser-open"]
# Enable tracing instrumentation
tracing = [
    "dep:tracing",
    "jacquard-common/tracing",
    "jacquard-oauth/tracing",
    "jacquard-identity/tracing",
]
dns = ["jacquard-identity/dns"]
streaming = [
    "jacquard-common/websocket",
    "jacquard-common/jss",
    "jacquard-oauth/streaming",
    "jacquard-identity/streaming",
    "dep:n0-future",
    "jacquard-api/streaming",
    # streaming::video uses app_bsky upload types; jetstream uses the
    # network_bsky subscription lexicons.
    "api_bluesky",
    "jacquard-api/network_bsky",
]
cache = ["jacquard-identity/cache"]
websocket = ["jacquard-common/websocket"]
zstd = ["jacquard-common/zstd", "dep:zstd"]
scope-check = ["jacquard-oauth/scope-check"]



[[example]]
name = "oauth_timeline"
path = "../../examples/oauth_timeline.rs"

[[example]]
name = "create_post"
path = "../../examples/create_post.rs"
required-features = ["loopback"]

[[example]]
name = "post_with_image"
path = "../../examples/post_with_image.rs"
required-features = ["loopback"]

[[example]]
name = "update_profile"
path = "../../examples/update_profile.rs"
required-features = ["loopback"]

[[example]]
name = "public_atproto_feed"
path = "../../examples/public_atproto_feed.rs"



[[example]]
name = "create_whitewind_post"
path = "../../examples/create_whitewind_post.rs"
required-features = ["loopback"]

[[example]]
name = "read_whitewind_post"
path = "../../examples/read_whitewind_post.rs"

[[example]]
name = "read_tangled_repo"
path = "../../examples/read_tangled_repo.rs"

[[example]]
name = "stream_get_blob"
path = "../../examples/stream_get_blob.rs"
required-features = ["api_bluesky", "streaming", "loopback"]

[[example]]
name = "resolve_did"
path = "../../examples/resolve_did.rs"

[[example]]
name = "update_preferences"
path = "../../examples/update_preferences.rs"
required-features = ["api_bluesky", "loopback"]


[[example]]
name = "app_password_create_post"
path = "../../examples/app_password_create_post.rs"
required-features = ["api_bluesky"]

[[example]]
name = "subscribe_repos"
path = "../../examples/subscribe_repos.rs"
required-features = ["api_bluesky", "streaming"]

[[example]]
name = "subscribe_jetstream"
path = "../../examples/subscribe_jetstream.rs"
required-features = ["streaming"]

[[example]]
name = "jetstream_replay"
path = "../../examples/jetstream_replay.rs"
required-features = ["streaming", "zstd"]

[[example]]
name = "moderated_timeline"
path = "../../examples/moderated_timeline.rs"
required-features = ["api_bluesky", "loopback"]

[dependencies]
jacquard-api = { version = "0.12.1", path = "../jacquard-api", default-features = false }
jacquard-common = { version = "0.12.1", path = "../jacquard-common", default-features = false }
jacquard-oauth = { version = "0.12.1", path = "../jacquard-oauth", default-features = false }
reqwest = { workspace = true, optional = true }
jacquard-derive = { version = "0.12.1", path = "../jacquard-derive", optional = true }
jacquard-identity = { version = "0.12.1", path = "../jacquard-identity", default-features = false }



#bon.workspace = true
trait-variant.workspace = true
bytes.workspace = true
http.workspace = true
miette = { workspace = true }
# reqwest is enabled through the reqwest-client feature.
serde.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# jetstream archive decoding: the .jss shapes (incl. xxh3 checksum
# validation) live in jacquard-common's jss module
# zstd decompresses .jss block frames (always compressed upstream)
zstd = { workspace = true, optional = true }
tokio = { workspace = true, default-features = false, features = ["sync"] }
smol_str.workspace = true
webpage.workspace = true
httpdate = "1"
jose-jwk = { workspace = true, features = ["p256"] }
tracing = { workspace = true, optional = true }
n0-future = { workspace = true, optional = true }
serde_ipld_dagcbor.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
jacquard-identity = { version = "0.12.1", path = "../jacquard-identity", features = ["cache"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
regex = { workspace = true, default-features = false, features = ["std", "perf-literal", "unicode"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
regex-lite = "0.1"
#ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"]}

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
gloo-storage = "0.4"

[dev-dependencies]
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
tokio = { workspace = true, features = ["signal"] }
viuer = { version = "0.11", features = ["print-file"] }
tiff = { version = "0.11" }
image = { version = "0.25" }
wiremock = "0.6"

[package.metadata.docs.rs]
features = ["api_all", "derive", "dns", "streaming"]
