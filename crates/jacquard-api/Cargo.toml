[package]
name = "jacquard-api"
description = "Generated AT Protocol API bindings for Jacquard"
edition.workspace = true
version = "0.12.0-rc.1"
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude.workspace = true
license.workspace = true

[package.metadata.docs.rs]
features = [ "bluesky", "other", "streaming" ]

[dependencies]
jacquard-common = { version = "0.12.0-rc.1", path = "../jacquard-common" }
jacquard-derive = { version = "0.12.0-rc.1", path = "../jacquard-derive" }
jacquard-lexicon = { version = "0.12.0-rc.1", path = "../jacquard-lexicon", default-features = false }
miette.workspace = true
serde.workspace = true
thiserror.workspace = true


[lints.rust]
# just so that my rust-analyzer shuts up about the module name for 2048.blue's namespace
non_snake_case = "allow"
# and because pretty mode still imports a *couple* extra things...
unused_imports = "allow"

[features]
default = [ "minimal", "std"]
std = ["serde/std", "jacquard-common/std"]
minimal =  [ "com_atproto", "com_bad_example"]
bluesky = [ "com_atproto", "app_bsky", "chat_bsky", "tools_ozone", "minimal"]
other = ["sh_tangled", "site_standard", "sh_weaver", "pub_leaflet", "net_anisota", "network_slices", "com_whtwnd", "place_stream", "blog_pckt",  "minimal" ]
lexicon_community = ["community_lexicon", "my_skylights", "com_whtwnd", "social_psky", "blue_linkat", "tools_smokesignal", "minimal"]
ufos = [ "moe_karashiiro", "dev_regnault", "buzz_bookhive", "uk_ewancroft",  "win_tomo_x", "dev_fudgeu", "dev_ocbwoy3", "net_bnewbold", "club_stellz", "dev_baileytownsend", "net_aftertheinter", "org_devcon","org_robocracy", "garden_lexicon", "social_clippr", "social_grain", "social_pmsky", "app_blebbit", "app_ocho", "uk_skyblur", "us_polhem", "blue_atplane",  "blue__2048", "net_mmatt", "minimal", "app_rocksky"]

streaming = ["jacquard-common/websocket"]

# note to manually add "site_standard" features to  weaver, pckt, leaflet, and offprint.
# feature resolution currently doesn't find them

