[package]
name = "jacquard-identity"
edition.workspace = true
version = "0.9.5"
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
description = "ATProto identity resolution utilities for Jacquard"

[features]
dns = ["dep:hickory-resolver"]
tracing = ["dep:tracing"]
streaming = ["jacquard-common/streaming"]
cache = ["dep:mini-moka"]

[dependencies]
trait-variant.workspace = true
bon.workspace = true
bytes.workspace = true
jacquard-common = { version = "0.9", path = "../jacquard-common", features = ["reqwest-client"] }
jacquard-api = {  version = "0.9", path = "../jacquard-api", default-features = false, features = ["minimal"] }
jacquard-lexicon = { version = "0.9", path = "../jacquard-lexicon", default-features = false }
percent-encoding.workspace = true
reqwest.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
http.workspace = true
serde_html_form.workspace = true
urlencoding.workspace = true
tracing = { workspace = true, optional = true }
n0-future.workspace = true
mini-moka = { package = "mini-moka-wasm", version = "0.10", path = "../mini-moka-wasm",  optional = true }
# mini-moka = { version = "0.10",   optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hickory-resolver = { optional = true, version = "0.24", default-features = false, features = ["system-config", "tokio-runtime"]}
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
mini-moka = { package = "mini-moka-wasm", version = "0.10",path = "../mini-moka-wasm", features = ["js"],  optional = true }
#ring = { version = "0.17", default-features = false, features = ["wasm32_unknown_unknown_js"]}

[[example]]
name = "resolve_lexicon"
path = "../../examples/resolve_lexicon.rs"
required-features = ["dns"]
