[package]
name = "jacquard-identity"
edition.workspace = true
version = "0.9.0"
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
description = "ATProto identity resolution utilities for Jacquard"

[features]
dns = ["dep:hickory-resolver"]
tracing = ["dep:tracing"]
streaming = ["jacquard-common/streaming", "dep:n0-future"]
cache = ["dep:mini-moka"]

[dependencies]
trait-variant.workspace = true
bon.workspace = true
bytes.workspace = true
jacquard-common = { version = "0.9", path = "../jacquard-common", features = ["reqwest-client"] }
jacquard-api = {  version = "0.9", path = "../jacquard-api", default-features = false, features = ["minimal"] }
jacquard-lexicon = { version = "0.9", path = "../jacquard-lexicon", default-features = false }
percent-encoding.workspace = true
reqwest.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
http.workspace = true
serde_html_form.workspace = true
urlencoding.workspace = true
tracing = { workspace = true, optional = true }
n0-future = { workspace = true, optional = true }
mini-moka = { version = "0.11.0", git = "https://github.com/moka-rs/mini-moka", rev = "da864e849f5d034f32e02197fee9bb5d5af36d3d", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hickory-resolver = { optional = true, version = "0.24", default-features = false, features = ["system-config", "tokio-runtime"]}
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
mini-moka = { git = "https://github.com/moka-rs/mini-moka", rev = "da864e849f5d034f32e02197fee9bb5d5af36d3d", features = ["js"] }


[[example]]
name = "resolve_lexicon"
path = "../../examples/resolve_lexicon.rs"
required-features = ["dns"]
