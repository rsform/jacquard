[package]
name = "jacquard-identity"
edition.workspace = true
version = "0.13.0"
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
description = "ATProto identity resolution utilities for Jacquard"

[features]
dns = ["dep:hickory-resolver"]
tracing = ["dep:tracing"]
streaming = ["jacquard-common/streaming"]
cache = ["dep:mini-moka"]
reqwest-client = ["dep:reqwest", "jacquard-common/reqwest-client", "jacquard-common/std"]
reqwest-stream = ["reqwest-client", "jacquard-common/reqwest-stream"]

[dependencies]
percent-encoding = "2"
trait-variant.workspace = true
bon.workspace = true
bytes.workspace = true
jacquard-common = { version = "0.13.0", path = "../jacquard-common" }
jacquard-lexicon = { version = "0.13.0", path = "../jacquard-lexicon", default-features = false }

reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
http.workspace = true
serde_html_form.workspace = true
tracing = { workspace = true, optional = true }
n0-future.workspace = true
mini-moka = { package = "mini-moka-wasm", version = "0.10", path = "../mini-moka-wasm",  optional = true }
# mini-moka = { version = "0.10",   optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hickory-resolver = { optional = true, version = "0.26", default-features = false, features = ["system-config", "tokio"]}
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }



#ring = { version = "0.17", default-features = false, features = ["wasm32_unknown_unknown_js"]}

[[example]]
name = "resolve_lexicon"
path = "../../examples/resolve_lexicon.rs"
required-features = ["dns"]
