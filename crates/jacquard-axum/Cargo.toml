[package]
name = "jacquard-axum"
edition.workspace = true
version = "0.12.0-rc.1"
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
description = "Axum server helpers for Jacquard"

[lib]
path = "src/lib.rs"

[[example]]
name = "axum_server"
path = "../../examples/axum_server.rs"

[[example]]
name = "axum_oauth_session"
path = "../../examples/axum_oauth_session.rs"

[dependencies]
axum = "0.8.6"
axum-extra = { version = "0.10.3", features = ["cookie", "cookie-private"] }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
jacquard = { version = "0.12.0-rc.1", path = "../jacquard", default-features = false, features = ["api"] }
jacquard-common = { version = "0.12.0-rc.1", path = "../jacquard-common", features = ["reqwest-client"] }
jacquard-derive = { version = "0.12.0-rc.1", path = "../jacquard-derive" }
jacquard-identity = { version = "0.12.0-rc.1", path = "../jacquard-identity", optional = true }
miette.workspace = true
multibase = { version = "0.9.1", optional = true }
mini-moka = { package = "mini-moka-wasm", version = "0.10", path = "../mini-moka-wasm", optional = true }
serde.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6.6", features = ["trace", "tracing"] }
tracing = "0.1.41"

[features]
default = ["service-auth", "service-auth-replay"]
service-auth = ["jacquard-common/service-auth", "dep:jacquard-identity", "dep:multibase"]
service-auth-replay = ["service-auth", "dep:mini-moka"]
tracing = []

[dev-dependencies]
axum-macros = "0.5.0"
jacquard = { version = "0.12.0-beta.1", path = "../jacquard", default-features = false, features = ["api_bluesky"] }
axum-test = "18.1.0"
clap.workspace = true
chrono.workspace = true
html-escape = "0.2"
k256 = { version = "0.13", features = ["ecdsa"] }
miette = { workspace = true, features = ["fancy"] }
rand = "0.8"
reqwest.workspace = true
serde_json.workspace = true
#tokio-test = "0.4.4"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "time"] }
