when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: nixery

dependencies:
  nixpkgs:
    - rustup
    - just
    - gcc

steps:
  - name: check basic wasm compatibility
    command: |
      rustup target add wasm32-unknown-unknown
      cargo build -p jacquard-common \
        --target wasm32-unknown-unknown \
        --features=websocket,reqwest-client \
        --no-default-features

  - name: run tests
    command: |
      cargo nextest run --workspace --exclude mini-moka-wasm

  - name: run tests
    command: |
      cargo test --doc --exclude lazy-collections,mini-moka-wasm
